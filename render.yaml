services:
  - type: web
    name: gtcc-ai-backend
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: CLOUD_API_URL
        value: "https://gtcc-ai-backend.onrender.com/api"
      # Các key dưới đây bạn cần cấu hình thủ công trong Dashboard của Render sau khi Deploy
      - key: GOOGLE_API_KEY
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: REDIS_URL
        sync: false
